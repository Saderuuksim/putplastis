name: Putplasčio kainų stebėjimas

on:
  workflow_dispatch: # Leidžia paleisti rankiniu būdu
  schedule:
    - cron: '0 8 * * *' # Kiekvieną dieną 8:00 val. ryto

permissions:
  contents: write # ŠITA DALIS BŪTINA, kad skriptas galėtų įrašyti failą atgal į repozitoriją!

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Atsisiųsti repozitoriją
      uses: actions/checkout@v4

    - name: Nustatyti Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Įdiegti priklausomybes
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Paleisti kainų skriptą
      env:
        SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      run: |
        python agentas.py
