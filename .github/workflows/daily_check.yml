name: Kasdienis kainu patikrinimas

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Atsisiųsti kodo kopiją
        uses: actions/checkout@v4

      - name: Paruošti Python aplinką
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Įdiegti reikalingas bibliotekas
        run: |
          pip install requests beautifulsoup4

      - name: Paleisti kainų agentą
      env:
        SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      run: python agentas.py
