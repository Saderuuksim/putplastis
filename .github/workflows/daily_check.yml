name: Kasdienis kainu patikrinimas

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Atsisiųsti kodo kopiją
        uses: actions/checkout@v4

      - name: Paruošti Python aplinką
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Įdiegti reikalingas bibliotekas
        run: |
          pip install requests beautifulsoup4 cloudscraper

      - name: Paleisti kainų agentą
        run: python agentas.py
